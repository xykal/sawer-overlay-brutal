name: Build Brutal APK v14 Clean Full Edit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" || true

      - name: Copy PWA to assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r pwa/* android-app/app/src/main/assets/www/
          ls -lh android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png pwa/icon-512.png || true

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew || true

      - name: Build SIGNED Release APK armeabi-v7a v14 (R8 + v1+v2+v3+v4)
        working-directory: android-app
        run: |
          gradle --no-daemon assembleRelease --stacktrace
          find app/build -name "*.apk" -type f -exec ls -lh {} \;
          # verify signing v1+v2
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk || true

      - name: Rename APK
        run: |
          mkdir -p dist
          find android-app/app/build/outputs/apk -name "*.apk" -type f | while read apk; do
            echo "Found $apk"
            cp "$apk" "dist/SawerOverlay-v15-FullBubble-SaweriaWidget-Live-Signed-armeabi-v7a.apk"
            base=$(basename "$apk")
            cp "$apk" "dist/$base"
          done
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawer-overlay-v15-full-bubble-saweria-widget-live-signed-armeabi-v7a
          path: dist/*.apk
          retention-days: 30

      - name: Create Release v15
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v15.0.${{ github.run_number }}-full-bubble-saweria-widget-live
          name: "v15.0 FULL BUBBLE CONTROL + SAWERIA WIDGET LIVE WEBSOCKET — Warna Bebas HEX + Donasi Real-time"
          body: |
            ## 🔥 v14.0 CLEAN FULL EDIT — Semua Bug v13 Fix + Fitur Baru

            ### ✅ Fix Bug v13 Yang Ngerepotin:
            - **Edit posisi gabisa keluar? FIXED** — Sekarang ada tombol SELESAI EDIT + BATAL gede di bawah overlay, tap bubble di mode edit = langsung SELESAI, notification ada action SELESAI EDIT, gak perlu restart HP lagi!
            - **Floating harus sama kayak di app? FIXED** — Render overlay di luar APK sama persis kayak di dalam app (shadow, border, warna, alpha, rotate, font)
            - **Harus restart HP baru keluar edit? FIXED** — Pakai finishEditMode() + originalLayersBeforeEdit restore + START_STICKY + try-catch windowManager

            ### ✨ Fitur Baru v14:
            - **Transparansi overlay** — Slider 10-100% di FULL EDIT, bisa bikin overlay semi transparan
            - **Transparansi bubble bulat** — Slider 20-100% di menu bubble, atur transparansi floating bulat yang melayang
            - **Full edit di bubble** — Tap bubble → menu → FULL EDIT → EditText teks + SeekBar size 12-80 + rotate -20..20 + transparansi + color picker teks/bg + style BOX/TAPE/STAMP + font family + save/batal/hapus
            - **Saweria link tanpa connect** — Tempel link https://saweria.co/overlays/xxx langsung di PWA (card SAWERIA LINK) atau di bubble menu, auto jadi overlay tanpa perlu connect akun!
            - **Logo & icon konsisten** — Icon brutalism S kuning hitam 512px optimasi (21KB per density, 177KB PWA), konsisten di launcher + PWA + header + bubble, clean brutalism
            - **Verifikasi v1+v2+v3+v4** — Signing v1+v2+v3+v4 enabled di build.gradle.kts, apksigner verify
            - **Clean ga ramai** — No emoji, brutalism clean, bottom nav 3 item (TEKS FULL EDIT / BUBBLE KECIL / SAVE V1+V2), bubble kecil 48px snap kiri/kanan

            ### 📦 APK v14:
            - **SawerOverlay-v14-Clean-FullEdit-Signed-armeabi-v7a.apk ~3MB signed v1+v2+v3+v4**
            - **armeabi-v7a** = semua HP Android lama & baru bisa install, file kecil optimasi R8
            - Install: download → buka → izinkan → install

            ### 🎯 Cara Pakai Super Gampang:
            1. Buka app → tab TEKS → tambah teks overlay
            2. Tap FULL EDIT di bubble menu atau di PWA buat atur transparansi/rotate/size/warna/shape/font
            3. Tab BUBBLE KECIL → MASUK MODE LIVE + BUBBLE
            4. Pencet HOME → bubble kuning 48px muncul di atas TikTok (snap kiri/kanan)
            5. Tap bubble → menu draggable (drag header buat geser) → EDIT POSISI OVERLAY → drag overlay di atas TikTok → SELESAI EDIT (tombol gede di bawah) atau tap bubble lagi
            6. Atur transparansi bubble 20-100% di menu
            7. Tempel link Saweria: di PWA ada card SAWERIA LINK → paste link overlay → TAMBAH, atau di bubble menu ada input link → TAMBAH DARI LINK
            8. SAVE V1+V2 di bottom nav

            ### 🔧 Teknis:
            - FloatingOverlayService v14: finishEditMode(), cancelEditMode(), originalLayersBeforeEdit, bubble tap exit, overlay SELESAI+BATAL buttons, notification SELESAI EDIT action, bubbleAlpha prefs, showFullEdit() lengkap, saweria link input, snapBubbleToEdge left/right
            - PWA v14: 3 bottom nav, props full edit alpha/rotate/size/w/font/style/color/bg, bubble alpha, saweria link card paste+addFromSaweriaLink, logo img, bubble 48px snap, bubble-menu draggable FULL EDIT/HAPUS/DUPLIKAT
            - Icon 512px brutalism S kuning optimasi
            - Build v1+v2+v3+v4 signing verification

            **Link Download:** APK di bawah ini
          files: dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
