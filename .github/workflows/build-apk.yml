name: Build Brutal APK armeabi-v7a

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK (fix)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" || true

      - name: Fix ic_launcher placeholder
        run: |
          mkdir -p android-app/app/src/main/res/mipmap-hdpi android-app/app/src/main/res/mipmap-mdpi android-app/app/src/main/res/mipmap-xhdpi
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png android-app/app/src/main/res/mipmap-mdpi/
          cp android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xhdpi/

      - name: Copy PWA to assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r pwa/* android-app/app/src/main/assets/www/

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew || true

      - name: Build APK armeabi-v7a Debug
        working-directory: android-app
        run: |
          gradle --no-daemon assembleDebug --stacktrace
          find app/build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Rename APK for armeabi-v7a
        run: |
          mkdir -p dist
          find android-app -name "*.apk" -type f | while read apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "dist/${base}-armeabi-v7a.apk"
          done
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawer-overlay-brutal-armeabi-v7a
          path: dist/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}-armeabi-v7a
          name: "Brutal v2.0.${{ github.run_number }} — armeabi-v7a — No RTMP"
          body: |
            ## SawerOverlay Brutal — No RTMP Edition
            
            **Build:** armeabi-v7a only (32-bit ARM) — 5.4MB
            **Design:** Brutalism — hitam putih kuning, border tebal, no neon
            
            ### Cara pakai tanpa RTMP:
            1. Install APK di Android
            2. Buka app, edit overlay
            3. Klik MASUK MODE LIVE
            4. Buka TikTok > LIVE > Mobile Gaming > Share Screen > Pilih SawerOverlay
            5. Penonton liat overlay, lu bisa stealth 15%
            
            APK ini cuma untuk armeabi-v7a — work di 90% HP Android.
          files: dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
